<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Saver</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #402D98; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        ul { list-style-type: none; padding: 0; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Save Your Name</h2>
        <form action="/save" method="POST">
            <input type="text" name="username" placeholder="Enter name here" required>
            <button type="submit">Save Name</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">

        <form action="/show" method="GET">
            <button type="submit">Show Saved Names</button>
        </form>

        {% if names %}
        <h3>Saved Names:</h3>
        <ul>
            {% for name in names %}
                <li>{{ name.name }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>
</body>
</html>
